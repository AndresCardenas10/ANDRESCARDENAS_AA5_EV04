# Documentacion OpenAPI 3 de la API del SGB (se visualiza en http://localhost:3000/api-docs)
openapi: 3.0.3
info:
  title: API REST - Sistema Gestión Barbería (SGB)
  version: 1.0.0
  description: |-
    Servicios web del proyecto SGB (Evidencia GA7-220501096-AA5-EV03). Aprendiz: Andrés Cárdenas, ficha 3186668.

    **Autenticación:** inicie sesión con `POST /api/auth/login`, copie el `token` y péguelo en el botón **Authorize** (arriba a la derecha).

    **Formato:** todas las respuestas JSON tienen la forma `{ "exito": true|false, "mensaje": "...", "datos": ... }`. Los errores de validación incluyen `errores: [{ campo, mensaje }]`.

    Cuentas demo (datos-demo.sql): admin@demo.com, barbero@demo.com y cliente@demo.com, contraseña Demo1234.
servers:
  - url: http://localhost:3000
    description: Servidor local
tags:
  - name: Salud
  - name: Autenticación
  - name: Usuarios
  - name: Servicios
  - name: Horarios
  - name: Citas
  - name: Pagos
  - name: Inventario
  - name: Notificaciones
  - name: Reportes
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RespuestaError:
      type: object
      properties:
        exito:
          type: boolean
          example: false
        mensaje:
          type: string
        errores:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
paths:
  /api/salud:
    get:
      tags:
        - Salud
      summary: Estado de la API y la base de datos
      description: |-
        Comprueba que el servidor responde y que la conexión con la base de datos sgb funciona.

        **Acceso:** Público (sin token)
      operationId: get__api_salud
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                mensaje: API del SGB activa
                baseDatos: conectada
                documentacion: /api-docs
        "503":
          description: La base de datos no esta disponible en este momento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: La base de datos no esta disponible en este momento
                  value:
                    exito: false
                    mensaje: La base de datos no esta disponible en este momento
  /api/auth/registro:
    post:
      tags:
        - Autenticación
      summary: Registrar una cuenta de cliente
      description: |-
        Crea un usuario con rol Cliente. La contraseña se guarda cifrada con bcrypt.

        **Acceso:** Público (sin token)
      operationId: post__api_auth_registro
      responses:
        "201":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                mensaje: Cuenta creada correctamente. Ya puede iniciar sesion
                datos:
                  id: 21
                  idRol: 3
                  rol: Cliente
                  nombre: Laura
                  apellido: Gomez
                  nombreCompleto: Laura Gomez
                  correo: laura742037@correo.com
                  telefono: "3001234567"
                  activo: true
                  creadoEn: 2026-10-29 00:29:02
        "400":
          description: Datos invalidos (el detalle de cada campo viene en "errores")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Datos invalidos (el detalle de cada campo viene en "errores")
                  value:
                    exito: false
                    mensaje: Datos invalidos (el detalle de cada campo viene en "errores")
        "409":
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Ya existe una cuenta con ese correo
                  value:
                    exito: false
                    mensaje: Ya existe una cuenta con ese correo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  description: Nombre (máx. 100)
                apellido:
                  type: string
                  description: Apellido (máx. 100)
                correo:
                  type: string
                  description: Correo único
                contrasena:
                  type: string
                  description: Mínimo 8 caracteres, con letras y números
                telefono:
                  type: string
                  description: Teléfono (opcional)
              required:
                - nombre
                - apellido
                - correo
                - contrasena
            example:
              nombre: Laura
              apellido: Gomez
              correo: laura742037@correo.com
              contrasena: Clave1234
              telefono: "3001234567"
  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión (obtener token JWT)
      description: |-
        Valida correo y contraseña. Si son correctos responde "Autenticación satisfactoria" y entrega un token JWT que se envía en las demás peticiones con el encabezado Authorization: Bearer <token>. Tras 5 intentos fallidos el correo se bloquea 15 minutos.

        **Acceso:** Público (sin token)
      operationId: post__api_auth_login
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                mensaje: Autenticación satisfactoria
                datos:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  tipoToken: Bearer
                  expiraEn: 8h
                  usuario:
                    id: 3
                    idRol: 3
                    rol: Cliente
                    nombre: Juan
                    apellido: Cliente
                    nombreCompleto: Juan Cliente
                    correo: cliente@demo.com
                    telefono: "3000000003"
                    activo: true
                    creadoEn: 2026-10-29 00:15:10
        "400":
          description: Debe enviar correo y contrasena
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Debe enviar correo y contrasena
                  value:
                    exito: false
                    mensaje: Debe enviar correo y contrasena
        "401":
          description: Correo o contrasena incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Correo o contrasena incorrectos
                  value:
                    exito: false
                    mensaje: Correo o contrasena incorrectos
        "403":
          description: Su cuenta esta desactivada. Contacte al administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Su cuenta esta desactivada. Contacte al administrador
                  value:
                    exito: false
                    mensaje: Su cuenta esta desactivada. Contacte al administrador
        "429":
          description: Demasiados intentos fallidos. Espere 15 minutos e intente de nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Demasiados intentos fallidos. Espere 15 minutos e intente de nuevo
                  value:
                    exito: false
                    mensaje: Demasiados intentos fallidos. Espere 15 minutos e intente de nuevo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  description: Correo registrado
                contrasena:
                  type: string
                  description: Contraseña
              required:
                - correo
                - contrasena
            example:
              correo: cliente@demo.com
              contrasena: Demo1234
  /api/auth/recuperar:
    post:
      tags:
        - Autenticación
      summary: Solicitar código de recuperación
      description: |-
        Genera un código de 6 dígitos válido por 15 minutos (se guarda cifrado en usuario.token_recuperacion). Responde igual exista o no el correo. En modo desarrollo el código viene en la respuesta porque el proyecto no tiene servidor de correo.

        **Acceso:** Público (sin token)
      operationId: post__api_auth_recuperar
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                mensaje: Si el correo esta registrado, se genero un codigo de recuperacion valido por 15 minutos
                datos:
                  codigo: "308538"
                  nota: Solo en modo desarrollo; en produccion se enviaria por correo
        "400":
          description: Datos invalidos (el detalle de cada campo viene en "errores")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Datos invalidos (el detalle de cada campo viene en "errores")
                  value:
                    exito: false
                    mensaje: Datos invalidos (el detalle de cada campo viene en "errores")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  description: Correo de la cuenta
              required:
                - correo
            example:
              correo: laura742037@correo.com
  /api/auth/restablecer:
    post:
      tags:
        - Autenticación
      summary: Restablecer contraseña con el código
      description: |-
        Cambia la contraseña si el código es correcto y no ha vencido. El código queda inutilizado.

        **Acceso:** Público (sin token)
      operationId: post__api_auth_restablecer
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                mensaje: Contrasena restablecida. Ya puede iniciar sesion
        "400":
          description: Datos invalidos (el detalle de cada campo viene en "errores") | El codigo no es valido o ya expiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Datos invalidos (el detalle de cada campo viene en "errores")
                  value:
                    exito: false
                    mensaje: Datos invalidos (el detalle de cada campo viene en "errores")
                caso2:
                  summary: El codigo no es valido o ya expiro
                  value:
                    exito: false
                    mensaje: El codigo no es valido o ya expiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  description: Correo de la cuenta
                codigo:
                  type: string
                  description: Código de 6 dígitos
                contrasenaNueva:
                  type: string
                  description: Mínimo 8 caracteres, letras y números
              required:
                - correo
                - codigo
                - contrasenaNueva
            example:
              correo: laura742037@correo.com
              codigo: "308538"
              contrasenaNueva: Nueva1234
  /api/auth/perfil:
    get:
      tags:
        - Autenticación
      summary: Ver mi perfil
      description: |-
        Devuelve los datos del usuario dueño del token.

        **Acceso:** Cualquier usuario con sesión
      operationId: get__api_auth_perfil
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                datos:
                  id: 3
                  idRol: 3
                  rol: Cliente
                  nombre: Juan
                  apellido: Cliente
                  nombreCompleto: Juan Cliente
                  correo: cliente@demo.com
                  telefono: "3000000003"
                  activo: true
                  creadoEn: 2026-10-29 00:15:10
        "401":
          description: Debe iniciar sesion (falta el token de acceso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Debe iniciar sesion (falta el token de acceso)
                  value:
                    exito: false
                    mensaje: Debe iniciar sesion (falta el token de acceso)
      security:
        - bearerAuth: []
    put:
      tags:
        - Autenticación
      summary: Editar mi perfil
      description: |-
        El usuario actualiza su nombre, apellido o teléfono. El correo y el rol no se cambian aquí.

        **Acceso:** Cualquier usuario con sesión
      operationId: put__api_auth_perfil
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                mensaje: Perfil actualizado
                datos:
                  id: 3
                  idRol: 3
                  rol: Cliente
                  nombre: Juan
                  apellido: Cliente
                  nombreCompleto: Juan Cliente
                  correo: cliente@demo.com
                  telefono: "3000000003"
                  activo: true
                  creadoEn: 2026-10-29 00:15:10
        "400":
          description: Datos invalidos (el detalle de cada campo viene en "errores")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Datos invalidos (el detalle de cada campo viene en "errores")
                  value:
                    exito: false
                    mensaje: Datos invalidos (el detalle de cada campo viene en "errores")
        "401":
          description: Debe iniciar sesion (falta el token de acceso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Debe iniciar sesion (falta el token de acceso)
                  value:
                    exito: false
                    mensaje: Debe iniciar sesion (falta el token de acceso)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  description: Nombre
                apellido:
                  type: string
                  description: Apellido
                telefono:
                  type: string
                  description: Teléfono
            example:
              telefono: "3000000003"
  /api/auth/contrasena:
    put:
      tags:
        - Autenticación
      summary: Cambiar mi contraseña
      description: |-
        Cambia la contraseña verificando primero la contraseña actual.

        **Acceso:** Cualquier usuario con sesión
      operationId: put__api_auth_contrasena
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                mensaje: Contrasena actualizada
        "400":
          description: Datos invalidos (el detalle de cada campo viene en "errores") | La contrasena actual no es correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Datos invalidos (el detalle de cada campo viene en "errores")
                  value:
                    exito: false
                    mensaje: Datos invalidos (el detalle de cada campo viene en "errores")
                caso2:
                  summary: La contrasena actual no es correcta
                  value:
                    exito: false
                    mensaje: La contrasena actual no es correcta
        "401":
          description: Debe iniciar sesion (falta el token de acceso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Debe iniciar sesion (falta el token de acceso)
                  value:
                    exito: false
                    mensaje: Debe iniciar sesion (falta el token de acceso)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contrasenaActual:
                  type: string
                  description: Contraseña actual
                contrasenaNueva:
                  type: string
                  description: Mínimo 8 caracteres, letras y números
              required:
                - contrasenaActual
                - contrasenaNueva
            example:
              contrasenaActual: Demo1234
              contrasenaNueva: Demo1234
  /api/usuarios/barberos:
    get:
      tags:
        - Usuarios
      summary: Listar barberos activos
      description: |-
        Lista los barberos activos (id y nombre) para elegir al agendar una cita.

        **Acceso:** Cualquier usuario con sesión
      operationId: get__api_usuarios_barberos
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                datos:
                  - id: 2
                    nombre: Carlos
                    apellido: Barbero
                    nombreCompleto: Carlos Barbero
                  - id: 5
                    nombre: Pedro
                    apellido: Navaja
                    nombreCompleto: Pedro Navaja
        "401":
          description: Debe iniciar sesion (falta el token de acceso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Debe iniciar sesion (falta el token de acceso)
                  value:
                    exito: false
                    mensaje: Debe iniciar sesion (falta el token de acceso)
      security:
        - bearerAuth: []
  /api/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      description: |-
        Lista los usuarios con filtros opcionales. Para cada usuario incluye el número de citas completadas y el total pagado (verificado).

        **Acceso:** Administrador
      operationId: get__api_usuarios
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                datos:
                  - id: 2
                    idRol: 2
                    rol: Barbero
                    nombre: Carlos
                    apellido: Barbero
                    nombreCompleto: Carlos Barbero
                    correo: barbero@demo.com
                    telefono: "3000000002"
                    activo: true
                    creadoEn: 2026-10-29 00:15:10
                    totalCitas: 0
                    totalGastado: 0
                  - id: 5
                    idRol: 2
                    rol: Barbero
                    nombre: Pedro
                    apellido: Navaja
                    nombreCompleto: Pedro Navaja
                    correo: pedro3013405@barberia.com
                    telefono: "3019998877"
                    activo: true
                    creadoEn: 2026-10-29 00:16:54
                    totalCitas: 0
                    totalGastado: 0
        "400":
          description: Datos invalidos (el detalle de cada campo viene en "errores")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Datos invalidos (el detalle de cada campo viene en "errores")
                  value:
                    exito: false
                    mensaje: Datos invalidos (el detalle de cada campo viene en "errores")
        "401":
          description: Debe iniciar sesion (falta el token de acceso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Debe iniciar sesion (falta el token de acceso)
                  value:
                    exito: false
                    mensaje: Debe iniciar sesion (falta el token de acceso)
        "403":
          description: Su rol no tiene permiso para esta accion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Su rol no tiene permiso para esta accion
                  value:
                    exito: false
                    mensaje: Su rol no tiene permiso para esta accion
      security:
        - bearerAuth: []
      parameters:
        - name: rol
          in: query
          required: false
          description: Administrador, Barbero o Cliente
          schema:
            type: string
        - name: activo
          in: query
          required: false
          description: true / false
          schema:
            type: boolean
        - name: buscar
          in: query
          required: false
          description: Texto en nombre o correo
          schema:
            type: string
    post:
      tags:
        - Usuarios
      summary: Crear usuario
      description: |-
        El administrador crea cuentas de cualquier rol (por ejemplo, barberos).

        **Acceso:** Administrador
      operationId: post__api_usuarios
      responses:
        "201":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                mensaje: Usuario creado
                datos:
                  id: 22
                  idRol: 2
                  rol: Barbero
                  nombre: Pedro
                  apellido: Navaja
                  nombreCompleto: Pedro Navaja
                  correo: pedro742037@barberia.com
                  telefono: "3011112233"
                  activo: true
                  creadoEn: 2026-10-29 00:29:02
        "400":
          description: Datos invalidos (el detalle de cada campo viene en "errores")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Datos invalidos (el detalle de cada campo viene en "errores")
                  value:
                    exito: false
                    mensaje: Datos invalidos (el detalle de cada campo viene en "errores")
        "401":
          description: Debe iniciar sesion (falta el token de acceso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Debe iniciar sesion (falta el token de acceso)
                  value:
                    exito: false
                    mensaje: Debe iniciar sesion (falta el token de acceso)
        "403":
          description: Su rol no tiene permiso para esta accion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Su rol no tiene permiso para esta accion
                  value:
                    exito: false
                    mensaje: Su rol no tiene permiso para esta accion
        "409":
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Ya existe una cuenta con ese correo
                  value:
                    exito: false
                    mensaje: Ya existe una cuenta con ese correo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  description: Nombre
                apellido:
                  type: string
                  description: Apellido
                correo:
                  type: string
                  description: Correo único
                contrasena:
                  type: string
                  description: Mínimo 8 caracteres, letras y números
                rol:
                  type: string
                  description: Administrador, Barbero o Cliente
                telefono:
                  type: string
                  description: Teléfono
              required:
                - nombre
                - apellido
                - correo
                - contrasena
                - rol
            example:
              nombre: Pedro
              apellido: Navaja
              correo: pedro742037@barberia.com
              contrasena: Barbero123
              rol: Barbero
              telefono: "3011112233"
  /api/usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Consultar un usuario
      description: |-
        Devuelve un usuario por su id.

        **Acceso:** Administrador
      operationId: get__api_usuarios_id_
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              example:
                exito: true
                datos:
                  id: 2
                  idRol: 2
                  rol: Barbero
                  nombre: Carlos
                  apellido: Barbero
                  nombreCompleto: Carlos Barbero
                  correo: barbero@demo.com
                  telefono: "3000000002"
                  activo: true
                  creadoEn: 2026-10-29 00:15:10
        "401":
          description: Debe iniciar sesion (falta el token de acceso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                caso1:
                  summary: Debe iniciar sesion (falta el token de acceso)
                  value:
                    exito: false
